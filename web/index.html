<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Emkay</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="emkay.css">
</head>
<body>
  <!-- the screen: ovos-gui-visage in a frame (app.js showVisage), under
       Emkay's own layer -->

  <!-- Emkay's own layer: boot, start button, mic, typing -->
  <div id="boot" class="boot">
    <div class="boot-face" aria-hidden="true"><span></span><span></span></div>
    <h1>Emkay</h1>
    <p id="boot-text">Loading…</p>
    <div class="bar"><div id="boot-bar"></div></div>
    <p id="boot-version" class="small boot-version"></p>
    <!-- first start only: set up now, or start on the defaults -->
    <div id="first" class="first" hidden>
      <p data-i18n="first.text"></p>
      <button id="first-setup" data-i18n="first.setup"></button>
    </div>
    <button id="start" data-i18n="start" hidden></button>
    <p class="small"><span data-i18n="about"></span> · <a href="https://github.com/emkay-voice/emkay" data-i18n="source"></a></p>
  </div>
  <button id="mic" class="mic" data-i18n-aria="mic" hidden></button>
  <!-- what the microphone is doing and what it heard (app.js, caption) -->
  <div id="caption" class="caption" aria-live="polite" hidden>
    <span id="caption-text"></span>
    <div id="caption-level" class="caption-level" hidden><div></div></div>
  </div>
  <form id="type" class="type" hidden><input id="type-text" data-i18n-placeholder="type" autocomplete="off"></form>
  <button id="keyboard" class="keyboard" data-i18n-aria="keyboard" hidden>⌨</button>
  <button id="menu-button" class="menu-button" data-i18n-aria="menu" hidden>⚙</button>

  <!-- the menu: OVOS' own settings (backups too: the panel's Backup page),
       full screen, about -->
  <div id="menu" class="menu" hidden>
    <div class="menu-card">
      <h2>Emkay</h2>
      <p id="storage-state" class="small"></p>
      <!-- each entry: Emkay-style icon (build/icons/make_icons.py), name and
           a line on what it is; what opens over the face returns here
           when it closes (app.js openFromMenu) -->
      <button id="menu-panel" class="menu-item">
        <img src="menu/settings.svg" alt="">
        <span><b data-i18n="menu.panel"></b><small data-i18n="menu.panel.hint"></small></span>
      </button>
      <a id="menu-store" class="menu-item" href="https://store.emkay.ai/" target="_blank" rel="noopener">
        <img src="menu/store.svg" alt="">
        <span><b data-i18n="menu.store"></b><small data-i18n="menu.store.hint"></small></span>
      </a>
      <button id="menu-network" class="menu-item">
        <img src="menu/guardian.svg" alt="">
        <span><b data-i18n="menu.network"></b><small data-i18n="menu.network.hint"></small></span>
      </button>
      <button id="menu-kiosk" class="menu-item">
        <img src="menu/kiosk.svg" alt="">
        <span><b data-i18n="menu.kiosk"></b><small data-i18n="menu.kiosk.hint"></small></span>
      </button>
      <button id="menu-install" class="menu-item" hidden>
        <img src="menu/install.svg" alt="">
        <span><b data-i18n="menu.install"></b><small data-i18n="menu.install.hint"></small></span>
      </button>
      <p id="install-ios" class="small" data-i18n="install.ios" hidden></p>
      <button id="menu-about" class="menu-item">
        <img src="icon.svg" alt="">
        <span><b data-i18n="menu.about"></b><small data-i18n="menu.about.hint"></small></span>
      </button>
      <p class="small"><span data-i18n="about"></span> ·
        <a href="https://github.com/emkay-voice/emkay" target="_blank" rel="noopener" data-i18n="source"></a></p>
      <button id="menu-close" class="secondary" data-i18n="close"></button>
    </div>
  </div>

  <!-- about: who made it, and what it stands on -->
  <div id="about" class="menu" hidden>
    <div class="menu-card about-card">
      <img src="icon.svg" class="about-icon" alt="">
      <h2>Emkay</h2>
      <p><span data-i18n="about.by"></span>
        <a href="https://github.com/andlo" target="_blank" rel="noopener">Andreas Lorensen</a></p>
      <p class="small" data-i18n="about.thanks"></p>
      <ul class="credits">
        <li><a href="https://openvoiceos.org" target="_blank" rel="noopener">OpenVoiceOS</a>
          – <span data-i18n="about.ovos"></span></li>
        <li><a href="https://github.com/MycroftAI" target="_blank" rel="noopener">Mycroft AI</a>
          – <span data-i18n="about.mycroft"></span></li>
        <li><a href="https://github.com/OscillateLabsLLC/ovos-visage" target="_blank" rel="noopener">ovos-visage</a>
          (Mike, Oscillate Labs) – <span data-i18n="about.visage"></span></li>
        <li><a href="https://pyodide.org" target="_blank" rel="noopener">Pyodide</a>
          – <span data-i18n="about.pyodide"></span></li>
      </ul>
      <p class="small" data-i18n="about.others"></p>
      <p class="small"><a id="about-release" target="_blank" rel="noopener"></a> ·
        <span id="about-version"></span> ·
        <a href="https://emkay.ai" target="_blank" rel="noopener">emkay.ai</a> ·
        <a href="https://github.com/emkay-voice/emkay" target="_blank" rel="noopener" data-i18n="source"></a></p>
      <button id="about-close" class="secondary" data-i18n="close"></button>
    </div>
  </div>

  <!-- "local only": nothing leaves the phone (ovos-phal-plugin-browser local_only.py, ovos-skill-guardian) -->
  <div id="offline-shield" class="offline-shield" role="status" hidden>
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 L54 13 V30 Q54 49 32 58 Q10 49 10 30 V13 Z"
      fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
      <path d="M22 32 l7 7 l13 -14" fill="none" stroke="currentColor" stroke-width="5"
      stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span data-i18n="offline.shield"></span>
  </div>
  <!-- a speech model or wake word being fetched after a settings change,
       and what speaks or listens meanwhile (app.js modelStatus) -->
  <div id="model-status" class="model-status" role="status" aria-live="polite" hidden>
    <div id="model-status-text"></div>
    <div class="model-bar" id="model-bar" hidden><div></div></div>
    <div id="model-status-interim" class="model-interim" hidden></div>
  </div>

  <!-- a tap the browser needs for what was asked by voice (ovos-skill-kiosk) -->
  <button id="tap-action" class="tap-action" hidden></button>

  <!-- the network log: what Emkay contacted, by day and service (netlog.js) -->
  <div id="network" class="menu" hidden>
    <div class="menu-card network-card">
      <h2 class="with-icon"><img src="menu/guardian.svg" alt=""><span data-i18n="network.title"></span></h2>
      <!-- local only (#23), the same switch as "go offline" by voice -->
      <button id="guardian-offline" class="guardian-offline"></button>
      <p class="small" data-i18n="network.intro"></p>
      <p id="network-summary" class="network-summary"></p>
      <div id="network-list" class="network-list"></div>
      <div class="network-actions">
        <button id="network-json" class="secondary">JSON</button>
        <button id="network-csv" class="secondary">CSV</button>
        <button id="network-clear" class="secondary" data-i18n="network.clear"></button>
      </div>
      <button id="network-close" class="secondary" data-i18n="close"></button>
    </div>
  </div>

  <!-- a new language needs the restart that fetches its intents (app.js) -->
  <button id="restart-lang" class="restart-lang" hidden></button>

  <!-- shut down (system.shutdown): dark until tapped, then a fresh start -->
  <div id="off" class="off" hidden></div>

  <!-- the skill store (store.emkay.ai) inside Emkay: "Get" posts the
       package here (app.js), so it installs in this Emkay; its own
       "Back to Emkay" button closes it -->
  <div id="store" class="panel" hidden>
    <iframe id="store-frame" title="Emkay skill store"></iframe>
  </div>

  <!-- the stock ovos-control-panel, served by the worker (sw.js, panel.py) -->
  <div id="panel" class="panel" hidden>
    <iframe id="panel-frame" title="OpenVoiceOS settings"></iframe>
    <button id="panel-close" class="panel-close" data-i18n-aria="close">×</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
