# Build Emkay from the OVOS alpha channel and publish it on GitHub Pages.
#
#   wheelhouse ──┬── intents (en-US) ──┐
#                ├── intents (da-DK) ──┼── site ── deploy
#                └── intents (...)   ──┘
#
# wheelhouse  every package the browser runs, built with `pip wheel --pre`
#             (the alpha channel), exactly what tools/build_site.py ships
# intents     one job per language: padatious is pre-trained on a normal
#             CPython with those same wheels, so a phone loads the networks
#             instead of training them for minutes. The result is kept in
#             the Actions cache, keyed by the exact wheels and the training
#             script: a push that changes neither (most do) reuses it.
#             "Run workflow" with retrain ticked trains anyway.
# site        Pyodide + the OVOS bundle + the intent caches + one m2v model
#             per language, assembled into a static site, then tested in a
#             headless Chrome (tools/probes/ci.py) before it may deploy
# deploy      GitHub Pages
#
# To add a language: add it to `matrix.lang` below. The site job takes the
# language list from the intent caches it receives, and fetches the m2v
# model for each of them.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retrain:
        description: "Train the intent caches again, even if the wheels did not change"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"   # nightly: pick up new OVOS alphas

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push waits for the running build instead of cancelling it, so a
# burst of pushes still ends with a deployed site (GitHub keeps only the
# newest waiting run).
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON: "3.14"   # the CPython version Pyodide 314 is built from

jobs:
  wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
      - name: Build wheels (alpha channel)
        run: |
          python -m pip install -U pip
          pip wheel --pre -w wheelhouse -r requirements/browser.txt
          pip wheel --pre --no-deps -w wheelhouse \
            -r requirements/browser-nodeps.txt -r requirements/browser-emscripten.txt
          ls wheelhouse | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse
          retention-days: 3

  intents:
    needs: wheelhouse
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the OVOS languages with 80 % or more of the skills translated
        # (openvoiceos.github.io/ovos-localize, stats); Emkay's own texts for
        # each are in locale/
        lang: [en-US, da-DK, de-DE, fr-FR, it-IT, es-ES, gl-ES, ca-ES, eu-ES,
               pt-PT, pt-BR, nl-NL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
      - uses: actions/download-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse
      # the same wheels (names carry the versions), the same training script
      # and the same requirements give the same networks
      - name: Cache key
        id: key
        run: |
          w=$(ls wheelhouse | sort | sha256sum | cut -c1-16)
          t=$(cat tools/build_intent_cache.py requirements/*.txt | sha256sum | cut -c1-12)
          echo "key=intents-${{ matrix.lang }}-$w-$t" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        if: ${{ !inputs.retrain }}
        with:
          path: intents.tar
          key: ${{ steps.key.outputs.key }}
      - name: Install what the browser runs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --pre --no-index --find-links wheelhouse -r requirements/browser.txt
          .venv/bin/pip install -q --no-deps --no-index --find-links wheelhouse -r requirements/browser-nodeps.txt
          # m2v takes no part in padatious' cache, and embedding every intent
          # registration on the way makes training many times slower
          .venv/bin/pip uninstall -y ovos-m2v-pipeline model2vec
      - name: Pre-train padatious (${{ matrix.lang }})
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          .venv/bin/python -u tools/build_intent_cache.py intent-cache ${{ matrix.lang }}
          # cache file names hold "skill:intent", and upload-artifact refuses
          # colons in file names, so the cache travels as one tar
          tar -cf intents.tar -C intent-cache .
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: intents.tar
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: intents-${{ matrix.lang }}
          path: intents.tar
          retention-days: 3

  site:
    needs: [wheelhouse, intents]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev
      - uses: actions/download-artifact@v4
        with:
          name: wheelhouse
          path: wheelhouse
      - uses: actions/download-artifact@v4
        with:
          pattern: intents-*
          path: intents
      - name: Unpack the intent caches
        run: |
          for d in intents/*/; do tar -xf "$d/intents.tar" -C "$d" && rm "$d/intents.tar"; done
          ls intents
      - name: Fetch one m2v model per language
        run: |
          pip install -q huggingface_hub
          langs=$(ls intents | sed 's/^intents-//')
          echo "languages: $langs"
          python tools/fetch_m2v_models.py m2v $langs
      - name: Fetch the wake word models (openWakeWord)
        run: python tools/fetch_wakeword_models.py oww
      - name: Build the site
        run: |
          python tools/wheelplan.py wheelhouse node_modules/pyodide/pyodide-lock.json > plan.json
          EMKAY_M2V=m2v EMKAY_OWW=oww python tools/build_site.py wheelhouse plan.json intents/*
          du -sh build/site
      # the site in a real headless Chrome before it goes out: first start
      # and setup, languages, installing a skill, a dialog transformer, the
      # browser PHAL plugin (tools/probes/ci.py); a failure stops the deploy
      - name: Browser tests
        run: CHROME="$(command -v google-chrome || command -v chromium)" python tools/probes/ci.py build/probe-logs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe-logs
          path: build/probe-logs
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
